title: ProfWeb
author: Longhai Li
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    html:
      toc: false         # Disable Quarto's TOC generation
      minimal: true       # This is the "nuclear option" - it removes most Quarto/Bootstrap scaffolding
      theme: cosmo         # Keep this to avoid Bootstrap conflicts
      page-layout: full
      format-links: true
      keep-md: true
      css:
        - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css
        - https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css
        - mystyles.css
        - iconstyles.css
      include-in-header:
        - text: <script src="/_extensions/profweb/mathjax.js"></script>
        - text: <script src="/_extensions/profweb/rendernav.js" defer></script>
        - text: <script src="/_extensions/profweb/loadtoc.js" defer></script>
    typst:
      keep-md: true
      fontsize: 11pt
      keep-typ: true
      number-sections: false
      shift-heading-level-by: -1
      fig-format: pdf
      margin:
        x: 20mm          # left + right together
        top: 25mm
        bottom: 25mm
      include-in-header:
        - text: |
            // Make URLs blue and underlined
            #show link: set text(fill: blue)
            #show link: underline

            // Make cross-references and citations blue and underlined
            #show ref: set text(fill: blue)
            #show ref: underline
